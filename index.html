<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk Lot Calculator</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, Tahoma, sans-serif;
      background: #0f1115;
      color: #eaeaea;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1a1d24;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    label { display:block; font-size: 13px; color:#9aa0aa; margin-bottom:4px; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f1115;
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .row { display:flex; gap:8px; }
    .row > div { flex:1; }
    .price { font-size: 22px; font-weight: 700; }
    .result { font-size: 20px; font-weight: 700; color: #4ade80; }

    .sideRow { display:flex; gap:8px; margin-bottom: 12px; }
    .sideBtn {
      flex:1; padding: 14px; border-radius: 10px; border: 2px solid #333;
      background:#0f1115; color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    }
    .sideBtn.buy.active { background:#22c55e; color:#04140a; border-color:#22c55e; }
    .sideBtn.sell.active { background:#ef4444; color:#1a0505; border-color:#ef4444; }

    button.confirm {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
    }
    button.confirm:disabled { background:#374151; color:#9aa0aa; cursor:not-allowed; }

    .status { font-size: 12px; color:#9aa0aa; text-align:center; margin-top:8px; }
    .warn { color:#f59e0b; font-size:12px; }
  </style>
</head>
<body>
  <div class="card" style="position:relative;">
    <div id="prevCandle" style="position:absolute; top:10px; left:16px; font-size:10px; color:#6b7280; text-align:left; direction:ltr;">prev h:-- l:--</div>
    <label>نماد (Symbol)</label>
    <select id="symbolSelect"></select>
    <div class="row">
      <div>
        <label>Bid</label>
        <div class="price" id="bidPrice">--</div>
      </div>
      <div>
        <label>Ask</label>
        <div class="price" id="askPrice">--</div>
        <div id="currCandle" style="font-size:12px; color:#9ca3af; text-align:left; direction:ltr; margin-top:4px;">now h:-- l:--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label>۱) جهت معامله</label>
    <div class="sideRow">
      <button id="buySideBtn" class="sideBtn buy">Buy</button>
      <button id="sellSideBtn" class="sideBtn sell">Sell</button>
    </div>

    <label>۲) قیمت Stop Loss</label>
    <input id="slInput" type="number" inputmode="decimal" placeholder="قیمت SL" />

    <label>۳) قیمت Take Profit (اختیاری)</label>
    <input id="tpInput" type="number" inputmode="decimal" placeholder="قیمت TP - خالی بذارید یعنی بدون TP" />

    <label>۴) ریسک به دلار</label>
    <input id="riskInput" type="number" inputmode="decimal" placeholder="مثلا 20" />

    <label>لات سایز محاسبه‌شده</label>
    <div class="result" id="lotResult">--</div>
    <div class="warn" id="warnBox"></div>
    <div class="warn" id="debugBox" style="color:#60a5fa;"></div>
  </div>

  <div class="card">
    <button id="confirmBtn" class="confirm" disabled>ابتدا جهت معامله را انتخاب کنید</button>
    <div class="status" id="statusBox">در حال اتصال به cTrader...</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
